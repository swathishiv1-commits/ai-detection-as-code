# Hand-written few-shot examples for the rule generator prompt.
# These are original, written for this project -- not copied from any existing
# Sigma rule repository -- so the model learns the *pattern* of going from a
# CTI snippet to structured rule JSON rather than memorizing existing rules.

- cti_snippet: >
    During the intrusion, the actor attempted to authenticate to the
    organization's VPN gateway using a list of common usernames paired with
    a small set of weak passwords, generating over 40 failed logins against
    a single account within a two-minute window before succeeding on the
    41st attempt.
  rule_json:
    title: "Multiple Failed VPN Logins Followed by Success (Possible Brute Force)"
    id: "8f0a1d2e-1111-4a3b-9c4d-000000000001"
    status: "experimental"
    description: "Detects a high volume of failed authentication attempts against a single account in a short window, followed by a successful login -- consistent with password brute forcing or spraying."
    references: []
    author: "AI-Generated (review required)"
    date: "2026-06-23"
    tags:
      - "attack.t1110"
      - "attack.credential-access"
    logsource:
      category: "authentication"
      product: "vpn"
      service: null
    detection:
      selections:
        - name: "selection_failed"
          fields:
            EventType: "login_failure"
        - name: "selection_success"
          fields:
            EventType: "login_success"
      condition: "selection_failed | count(by=user, window=2m) > 10 and selection_success"
    falsepositives:
      - "Users who genuinely forget their password and retry many times before succeeding"
      - "Misconfigured service accounts retrying with a stale credential before failing over"
    level: "medium"
    notes: "Threshold of 10 failures in 2 minutes is an approximation from the described '40 in 2 minutes' pattern, set conservatively to reduce false negatives on slower brute-force variants. Tune per environment."

- cti_snippet: >
    The threat actor obtained valid AWS IAM credentials through a phishing
    campaign and used them to call sts:AssumeRole from an IP address
    geolocated to a country where the organization has no employees or
    infrastructure, shortly before listing all S3 buckets in the account.
  rule_json:
    title: "AssumeRole From Unfamiliar Geography Followed by S3 Enumeration"
    id: "8f0a1d2e-1111-4a3b-9c4d-000000000002"
    status: "experimental"
    description: "Detects sts:AssumeRole calls originating from a country outside the organization's known operating regions, followed by S3 bucket enumeration -- consistent with use of stolen cloud credentials for reconnaissance."
    references: []
    author: "AI-Generated (review required)"
    date: "2026-06-23"
    tags:
      - "attack.t1078.004"
      - "attack.defense-evasion"
      - "attack.persistence"
    logsource:
      category: "cloud"
      product: "aws"
      service: "cloudtrail"
    detection:
      selections:
        - name: "selection_assume_role"
          fields:
            eventName: "AssumeRole"
            sourceIPAddress|contains: "" # placeholder -- real rule requires a maintained allow-list of expected countries/ASNs, not a static value
        - name: "selection_list_buckets"
          fields:
            eventName: "ListBuckets"
      condition: "selection_assume_role and selection_list_buckets"
    falsepositives:
      - "Employees travelling or using a corporate VPN that exits in an unexpected region"
      - "Legitimate third-party contractors or MSPs operating from the flagged geography"
    level: "high"
    notes: "Geo-fencing logic (the unfamiliar-country check) cannot be expressed as a static Sigma field match -- it requires an enrichment lookup against a maintained allow-list of expected countries/ASNs at query time. This rule should be paired with a geo-IP enrichment step in the SIEM rather than relying on Sigma syntax alone."

- cti_snippet: >
    Prior to encrypting files, the ransomware sample executed vssadmin.exe
    with arguments to delete all shadow copies on the host, then deleted
    Windows Server backup catalogs using wbadmin.exe, removing the victim's
    ability to recover without paying the ransom.
  rule_json:
    title: "Shadow Copy and Backup Catalog Deletion (Pre-Ransomware Indicator)"
    id: "8f0a1d2e-1111-4a3b-9c4d-000000000003"
    status: "experimental"
    description: "Detects deletion of volume shadow copies and Windows backup catalogs, a common precursor step ransomware uses to prevent victim recovery before encryption begins."
    references: []
    author: "AI-Generated (review required)"
    date: "2026-06-23"
    tags:
      - "attack.t1490"
      - "attack.impact"
    logsource:
      category: "process_creation"
      product: "windows"
      service: null
    detection:
      selections:
        - name: "selection_vssadmin"
          fields:
            Image|endswith: "vssadmin.exe"
            CommandLine|contains: "delete shadows"
        - name: "selection_wbadmin"
          fields:
            Image|endswith: "wbadmin.exe"
            CommandLine|contains: "delete catalog"
      condition: "selection_vssadmin or selection_wbadmin"
    falsepositives:
      - "Legitimate disk space cleanup scripts run by IT operations"
      - "Backup software reconfiguration performed by an administrator"
    level: "high"
    notes: ""

- cti_snippet: >
    The phishing payload launched a hidden PowerShell process with an
    encoded command that downloaded a second-stage script from a remote
    URL and executed it entirely in memory, never writing the payload to disk.
  rule_json:
    title: "Hidden Encoded PowerShell Downloading Remote Script"
    id: "8f0a1d2e-1111-4a3b-9c4d-000000000004"
    status: "experimental"
    description: "Detects PowerShell launched with hidden window style and a base64-encoded command, a common pattern for fileless second-stage payload delivery."
    references: []
    author: "AI-Generated (review required)"
    date: "2026-06-23"
    tags:
      - "attack.t1059.001"
      - "attack.execution"
      - "attack.defense-evasion"
    logsource:
      category: "process_creation"
      product: "windows"
      service: null
    detection:
      selections:
        - name: "selection_main"
          fields:
            Image|endswith: "powershell.exe"
            CommandLine|contains|all:
              - "-w hidden"
              - "-enc"
      condition: "selection_main"
    falsepositives:
      - "Legitimate IT automation or configuration management scripts that run PowerShell hidden and encoded by design"
    level: "high"
    notes: ""
